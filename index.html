<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Roll20 Chat Archive 로그를 티스토리·개인 홈페이지에 업로드 가능한 형태로 변환합니다." />
        <title>LBS - Roll20 로그 변환기</title>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="shortcut icon" href="./favicon.svg" />
        <link rel="stylesheet" href="./style.min.css" />
        <script src="./data.min.js"></script>
        <script src="./script.min.js" defer></script>
    </head>
    <body>
        <div class="wrapper">

            <!-- 로딩 -->
            <div class="loader-wrap">
                <div class="loader"></div>
                <span class="loader-text">변환 중…</span>
            </div>

            <!-- 헤더 -->
            <div class="header-area">
                <h1>ROLL20 로그 변환기 <span>LBS</span></h1>
                <div class="notice-box">
                    <p>* PC 및 브라우저 사양에 따라 딜레이가 생길 수 있습니다.</p>
                    <p>* 문제 발견 시 알려주세요.</p>
                    <p>* 페이지 링크를 공유하지 마세요.</p>
                </div>
            </div>

            <!-- 1. 로그 업로드 -->
            <div class="card">
                <div class="card-header">
                    <span class="step-badge">1</span>
                    <h2>로그 업로드</h2>
                </div>
                <p class="card-desc">
                    Chat Archive 페이지에서 개발자도구(F12)를 열고,
                    <code>'textchatcontainer'</code> 요소를 모두 복사해서 붙여넣습니다.
                </p>
                <div class="wrap col" style="gap:6px;">
                    <textarea id="log" placeholder="Chat Archive의 'textchatcontainer'를 모두 복사해서 붙여넣습니다."></textarea>
                    <div class="textarea-meta">
                        <span id="log_count">0 글자</span>
                    </div>
                </div>
            </div>

            <!-- 2. 옵션 -->
            <div class="card">
                <div class="card-header">
                    <span class="step-badge">2</span>
                    <h2>옵션 <small style="font-size:1.2rem;font-weight:400;color:var(--text-muted)">(선택)</small></h2>
                </div>
                <div class="option-group">
                    <label for="option_more">
                        <input type="checkbox" id="option_more" checked />
                        더보기/접기 추가 <span style="font-size:1.1rem;color:var(--text-muted)">(티스토리용)</span>
                    </label>
                    <label for="option_myself">
                        <input type="checkbox" id="option_myself" checked />
                        내 말하기 색상 제거
                    </label>
                    <label for="option_underline">
                        <input type="checkbox" id="option_underline" checked />
                        spacer 제거
                    </label>
                </div>
            </div>

            <!-- 3. 룰 -->
            <div class="card wrap rule">
                <div class="card-header">
                    <span class="step-badge">3</span>
                    <h2>룰 <small style="font-size:1.2rem;font-weight:400;color:var(--text-muted)">(선택)</small></h2>
                </div>
                <div class="option-group" id="rule_group">
                    <label for="rule_none">
                        <input type="radio" name="rule" id="rule_none" value="" checked />
                        없음
                    </label>
                    <label for="rule_coc">
                        <input type="radio" name="rule" id="rule_coc" value="coc" />
                        COC
                    </label>
                    <label for="rule_insane">
                        <input type="radio" name="rule" id="rule_insane" value="insane" />
                        inSANe
                    </label>
                    <label for="rule_magica_logia">
                        <input type="radio" name="rule" id="rule_magica_logia" value="magicalogia" />
                        마기로기
                    </label>
                    <label for="rule_dx3rd">
                        <input type="radio" name="rule" id="rule_dx3rd" value="dx3rd" />
                        더블크로스
                    </label>
                </div>
                <div class="rule-hint" id="rule_hint"></div>
            </div>

            <!-- 4. 커스텀 CSS -->
            <div class="card">
                <div class="card-header">
                    <span class="step-badge">4</span>
                    <h2>커스텀 CSS <small style="font-size:1.2rem;font-weight:400;color:var(--text-muted)">(선택)</small></h2>
                </div>
                <textarea id="custom_css" placeholder="커스텀 CSS가 필요하다면 추가하세요. 선택자 상위에 'textchatcontainer'를 추가하는 것을 추천합니다."></textarea>
            </div>

            <!-- 5. 변환 -->
            <div class="btn-row">
                <button type="button" id="btn_submit" class="btn btn-primary" disabled>
                    ✦ 변환하기
                </button>
                <button type="button" id="btn_reset" class="btn btn-ghost">
                    초기화
                </button>
            </div>

            <!-- 6. 로그 수정 -->
            <div class="card card-hidden" id="card_step6">
                <div class="card-header">
                    <span class="step-badge">6</span>
                    <h2>로그 수정</h2>
                </div>
                <div class="preview-wrap">
                    <div id="result_preview_style" aria-hidden="true"></div>
                    <div id="result_preview" contenteditable="true" role="textbox" aria-label="변환된 로그 미리보기 (편집 가능)"></div>
                </div>
                <hr class="section-divider" />
                <div class="wrap row" style="justify-content:space-between;flex-wrap:wrap;gap:10px;">
                    <label for="option_split">
                        <input type="checkbox" id="option_split" />
                        2페이지로 분리 <span style="font-size:1.1rem;color:var(--text-muted)">(필요 시 체크)</span>
                    </label>
                    <button type="button" id="btn_submit_re" class="btn btn-secondary" disabled>
                        재변환
                    </button>
                </div>
            </div>

            <!-- 7. 로그 복사 -->
            <div class="card card-hidden" id="card_step7">
                <div class="card-header">
                    <span class="step-badge">7</span>
                    <h2>로그 복사</h2>
                </div>

                <div class="result-block">
                    <textarea id="result" readonly></textarea>
                    <button type="button" id="btn_copy_result" class="btn btn-copy" disabled>
                        복사 <span class="char-count" id="char_count_1"></span>
                    </button>
                </div>

                <div id="sub_result">
                    <div class="result-block">
                        <textarea id="result2" readonly></textarea>
                        <button type="button" id="btn_copy_result2" class="btn btn-copy" disabled>
                            2페이지 복사 <span class="char-count" id="char_count_2"></span>
                        </button>
                    </div>
                </div>
            </div>

        </div><!-- /.wrapper -->

        <!-- 토스트 컨테이너 -->
        <div id="toast-container" aria-live="polite"></div>

        <!-- 히든 트리거 -->
        <button type="button" id="btn_hide" class="btn-hide" aria-hidden="true" tabindex="-1">hide</button>
    </body>
</html>
